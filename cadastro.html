<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de contas | NETFLIX</title>
        <link rel="stylesheet" href="cadastro.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body>
        <main>
            <section>
                <h1 class="title">Cadastro De Contas</h1>
                <form id="data-form">
                    <fieldset class="campos">
                        <label for="ipt-name"><i class="fa-solid fa-user icone"></i></label>
                        <input type="text" class="data-ipt" placeholder="Nome" name="nome">
                    </fieldset>
                    <fieldset class="campos">
                        <label for="ipt-email"><i class="fa-regular fa-envelope icone"></i></label>
                        <input type="email" class="data-ipt" placeholder="Email" name="email">
                    </fieldset>
                    <fieldset class="campos">
                        <label for="ipt-idade"><i class="fa-solid fa-calendar icone"></i></label>
                        <input type="text" class="data-ipt" placeholder="Idade" name="idade">
                    </fieldset>
                    <button id="btn" class="btn">Cadastrar</button>
                </form>
            </section>
        </main>
    </body>
    <script src="cadastro.js"></script>
</html>
